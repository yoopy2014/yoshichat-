<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>yoshichat リリースまであと...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #timer { font-size: 3rem; font-weight: bold; color: #0288d1; margin: 20px 0; }
        .btn { display: inline-block; padding: 15px 30px; margin: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: all 0.3s; }
        .btn-disabled { background: #cccccc; color: #777777; cursor: not-allowed; pointer-events: none; }
        .btn-active-web { background: #10ac84; color: white; }
        .btn-active-apk { background: #0288d1; color: white; }
    </style>
</head>
<body>
    <h1>yoshichat リリースまで</h1>
    <div id="timer">計算中...</div>
    
    <div id="actions">
        <a href="webchat.html" id="webBtn" class="btn btn-disabled">🚀 ブラウザで開始 (準備中)</a>
        <br>
        <a href="app-debug.apk" id="apkBtn" class="btn btn-disabled" download>📥 アプリをダウンロード (準備中)</a>
    </div>

    <script>
        const releaseDate = new Date("May 30, 2026 00:00:00").getTime();
        
        // 🔑 開発者用フラグ: URLに ?secret=yoshi を付けると即時解放！
        const urlParams = new URLSearchParams(window.location.search);
        const isDev = urlParams.get('secret') === 'yoshi';

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = releaseDate - now;

            // 0時前でも isDev なら強制解放！
            if (distance < 0 || isDev) {
                if (distance >= 0) {
                    document.getElementById("timer").innerHTML = "開発者モード起動中";
                } else {
                    clearInterval(x);
                    document.getElementById("timer").innerHTML = "公開中！";
                }
                
                const webBtn = document.getElementById("webBtn");
                const apkBtn = document.getElementById("apkBtn");

                webBtn.className = "btn btn-active-web";
                webBtn.innerText = "🚀 ブラウザでチャットを始める";
                
                apkBtn.className = "btn btn-active-apk";
                apkBtn.innerText = "📥 Androidアプリをダウンロード";
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById("timer").innerHTML = hours + "時間 " + minutes + "分 " + seconds + "秒";
            }
        }, 1000);
    </script>
</body>
</html>
