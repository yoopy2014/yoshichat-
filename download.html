<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>yoshichat リリースまであと...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #timer { font-size: 3rem; font-weight: bold; color: #0288d1; margin: 20px 0; }
        .hidden { display: none; }
        .btn-download { display: inline-block; padding: 15px 30px; background: #10ac84; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>yoshichat リリースまで</h1>
    <div id="timer">計算中...</div>
    
    <!-- リリース時間になるまで隠しておく場所 -->
    <div id="release-content" class="hidden">
        <h2>公開開始！</h2>
        <a href="webchat.html" class="btn-download">🚀 ブラウザでチャットを始める</a>
        <br><br>
        <a href="app-debug.apk" class="btn-download" style="background:#0288d1;">📥 Androidアプリをダウンロード</a>
    </div>

    <script>
        // 🗓️ 2026年5月30日 00:00:00 を設定
        const releaseDate = new Date("May 30, 2026 00:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = releaseDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = hours + "時間 " + minutes + "分 " + seconds + "秒";

            // 0時になったら表示を切り替える
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "公開中！";
                document.getElementById("release-content").classList.remove("hidden");
            }
        }, 1000);
    </script>
</body>
</html>
