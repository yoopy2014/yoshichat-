<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ヨシチャット - ようこそ</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #f8f9fa; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .timer-box { background: #fff3cd; padding: 15px; border-radius: 8px; font-weight: bold; color: #856404; margin: 20px 0; }
        .category { background: #f1f3f5; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .btn { display: block; padding: 15px; margin-top: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-disabled { background: #ced4da; color: #6c757d; cursor: not-allowed; pointer-events: none; }
        .btn-active { background: #0288d1; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>ヨシチャット</h1>
    <p>みんなでリアルタイムにおしゃべりできるチャットアプリ！</p>
    
    <div id="timer" class="timer-box">計算中...</div>

    <div class="category">
        <p>🤖 <strong>Androidの人（アプリ版）</strong></p>
        <a href="app-debug.apk" id="apkBtn" class="btn btn-disabled" download>アプリをダウンロード</a>
    </div>

    <div class="category">
        <p>🍎 <strong>iPhone / iPad / PCの人</strong></p>
        <a href="index.html" id="webBtn" class="btn btn-disabled">ブラウザでチャットを開く</a>
    </div>
</div>

<script>
    const releaseDate = new Date("May 30, 2026 00:00:00").getTime();
    const isDev = new URLSearchParams(window.location.search).get('secret') === 'yoshi';

    const x = setInterval(() => {
        const now = new Date().getTime();
        const dist = releaseDate - now;

        if (dist < 0 || isDev) {
            clearInterval(x);
            document.getElementById("timer").innerText = "🚀 公開中！今すぐ参加しよう！";
            document.getElementById("apkBtn").className = "btn btn-active";
            document.getElementById("webBtn").className = "btn btn-active";
        } else {
            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((dist % (1000 * 60)) / 1000);
            document.getElementById("timer").innerText = `🚀 公開まであと ${h}時間 ${m}分 ${s}秒`;
        }
    }, 1000);
</script>
</body>
</html>
