<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yoshichat - ブラウザ版</title>
    <style>
        /* ここはさっきのアプリ版と同じCSSをそのまま使ってね */
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { width: 90%; max-width: 400px; padding: 20px; text-align: center; }
        .login-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; }
        .login-btn { width: 100%; padding: 12px; background: #0288d1; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #chat-screen { display: none; flex-direction: column; height: 100vh; }
        .header { background: #0288d1; color: white; padding: 15px; display: flex; justify-content: space-between; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg-line { display: flex; flex-direction: column; }
        .msg-text { background: white; padding: 8px 12px; border-radius: 12px; width: fit-content; }
        .msg-me { align-self: flex-end; }
        .msg-me .msg-text { background: #dcf8c6; }
        .input-area { padding: 10px; background: white; display: flex; gap: 5px; }
        #messageInput { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
        #sendBtn { padding: 0 20px; background: #0288d1; color: white; border: none; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>yoshichat (ブラウザ版)</h2>
            <input type="text" id="usernameInput" class="login-input" placeholder="名前">
            <input type="email" id="emailInput" class="login-input" placeholder="メールアドレス">
            <input type="text" id="roomInput" class="login-input" placeholder="ルーム名">
            <button class="login-btn" onclick="joinChat()">チャットに参加</button>
        </div>
    </div>

    <div id="chat-screen">
        <div class="header">
            <span>yoshichat</span>
            <button onclick="location.reload()">退出</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="メッセージ...">
            <button id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        let socket, myName, myEmail, myRoom;

        async function joinChat() {
            myName = document.getElementById("usernameInput").value;
            myEmail = document.getElementById("emailInput").value;
            myRoom = document.getElementById("roomInput").value;

            // サーバー登録API
            await fetch("https://yoshichat-server.yoopy2014.workers.dev/register", {
                method: "POST",
                body: JSON.stringify({ email: myEmail, name: myName })
            });

            // WebSocket接続
            socket = new WebSocket(`wss://yoshichat-server.yoopy2014.workers.dev/?room=${encodeURIComponent(myRoom)}`);
            
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                const msgDiv = document.createElement("div");
                msgDiv.className = `msg-line ${data.senderEmail === myEmail ? 'msg-me' : ''}`;
                msgDiv.innerHTML = `<div class="msg-text">${data.message}</div>`;
                document.getElementById("messages").appendChild(msgDiv);
            };

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";
        }

        function sendMessage() {
            const text = document.getElementById("messageInput").value;
            socket.send(JSON.stringify({ email: myEmail, message: text }));
            document.getElementById("messageInput").value = "";
        }
    </script>
</body>
</html>
