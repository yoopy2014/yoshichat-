<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヨシチャット公式サイト</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; text-align: center; }
        .hero { background: #52aad8; color: white; padding: 60px 20px; }
        .hero h1 { font-size: 40px; margin: 0; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .btn { display: inline-block; padding: 15px 30px; background: #52aad8; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin: 10px; }
        .btn-secondary { background: #5cb85c; }
        .btn-mail { background: #f39c12; } /* メール用は少し色を変えて目立たせたよ */
        section { margin-bottom: 50px; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>ヨシチャット</h1>
        <p>シンプルで、どこか懐かしい。お友達とすぐつながるチャットアプリ。</p>
        <a href="[チャットアプリのURLを入れてね]" class="btn">チャットルームに入る</a>
    </div>

    <div class="container">
        <section>
            <h2>ヨシチャットとは？</h2>
            <p>面倒な登録は不要。名前とメールアドレスだけで、すぐにルームを作って仲間と会話ができます。</p>
        </section>

        <section>
            <h2>公式サポート</h2>
            <p>お問い合わせやご意見はこちらまでお願いします。</p>
            <a href="mailto:yoopy2014@gmail.com?subject=ヨシチャットについてのお問い合わせ" class="btn btn-mail">サポートへメールを送る</a>
            
    </div>

</body>
</html>
