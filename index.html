<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>yoshichat</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #0288d1; color: white; border: none; }
    </style>
</head>
<body>

<div id="loginScreen" class="box">
    <h2>ヨシチャット入室</h2>
    <input type="text" id="username" placeholder="表示名">
    <input type="email" id="email" placeholder="メールアドレス">
    <button onclick="enterChat()">入室する</button>
</div>

<div id="chatScreen" class="box" style="display:none;">
    <div id="chatBox" style="height:300px; overflow-y:scroll; border:1px solid #ccc; padding:10px;"></div>
    <input type="text" id="msgInput" placeholder="メッセージ...">
    <button onclick="send()">送信</button>
</div>

<script>
    // ページ読み込み時に履歴を確認
    window.onload = () => {
        const savedName = localStorage.getItem('username');
        const savedEmail = localStorage.getItem('email');
        
        // 履歴があれば自動で入室させる
        if(savedName && savedEmail) {
            showChat();
        }
    };

    function enterChat() {
        const name = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        if(!name || !email) { alert("入力してね！"); return; }

        // 入力を記憶
        localStorage.setItem('username', name);
        localStorage.setItem('email', email);
        showChat();
    }

    function showChat() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'block';
    }

    function send() {
        const text = document.getElementById('msgInput').value;
        const name = localStorage.getItem('username');
        
        // サーバーへ送信（nameとtextをセット）
        console.log("送信:", { name, text }); 

        document.getElementById('chatBox').innerHTML += `<div><strong>${name}</strong>: ${text}</div>`;
        document.getElementById('msgInput').value = '';
    }
</script>
</body>
</html>
